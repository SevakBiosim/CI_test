name: Experiment
description: Track a single experiment (one issue per experiment).
title: "[System][Method] short description"
labels: ["type:experiment", "status:active"]
body:
  - type: markdown
    attributes:
      value: |
        **This top post is a living document, not a one-time form.**
        Keep it accurate: if the plan pivots, edit the fields below rather than
        letting them go stale. Comments are the audit trail; this post is the TL;DR.

        See the [experiment policy](https://github.com/SevakBiosim/CI_test/blob/master/.github/EXPERIMENT_POLICY.md).

        Fix the title to `[System][Method] short description` — one word per
        bracket, e.g. `[A71EV2A][ABFE] Restraint atom selection`. Then add
        `system:*` / `method:*` labels and assign an owner.

  - type: textarea
    id: current-status
    attributes:
      label: Current status
      description: >
        One to three sentences: where things stand, and what happens next.
        Rewrite it whenever there is a meaningful new conclusion — this is the
        TL;DR that saves people reading the comments. The active / blocked /
        paused state goes in the `status:*` label, not here.
      value: "_YYYY-MM-DD — not started._"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose / hypothesis
      description: What question does this answer, and what do you expect to see?
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: Success criteria
      description: >
        Decide *before running* what result would make us adopt or reject this.
        Give a number where you can, so the conclusion cannot be
        reverse-engineered from the data once it is in. With no baseline, say
        instead what would count as having characterised the thing well enough
        to decide.
      placeholder: |
        e.g. Adopt if RMSE vs. experiment improves by >= 0.3 kcal/mol across the
        target set with no regression > 0.5 kcal/mol on any single ligand.
    validations:
      required: true

  - type: textarea
    id: target-set
    attributes:
      label: Target set(s)
      description: >
        Every system, ligand, or edge in scope — the title carries only the
        primary one, this field carries the full list. Link the set definition
        if one exists.
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: Baseline
      description: >
        What this is measured against, and where those numbers come from (issue,
        run directory, or published reference). If there is genuinely nothing to
        compare against, write `None` and say why — a first measurement or an
        exploratory characterisation is a valid answer, and it tells readers not
        to expect a delta.
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: >
        Do **not** retype the run parameters: each run writes an
        `output_config.json` recording MDSuite version, integrator, `dt`,
        lambda schedule, `n_windows`, `repeats`, restraints, estimator and the
        rest. Those files, in the uploaded data, are the ground truth. Use this
        field only for what they do not tell a reader.
      value: |
        - MDSuite version(s) used:
        - What varies across runs (the independent variable):
        - Anything not captured in `output_config.json` (manual edits, patched
          inputs, non-default hardware):
    validations:
      required: true

  - type: textarea
    id: data-location
    attributes:
      label: Data location
      description: >
        Links or paths to the uploaded runs and analysis. **Append a line, never
        overwrite** — one line per upload, so this stays the one place a reader
        finds everything, including the `output_config.json` files behind the
        Configuration field. Write `TBD` if nothing is uploaded yet.
      value: |
        - `YYYY-MM-DD` — what it is — where:
    validations:
      required: true

  - type: input
    id: compute
    attributes:
      label: Machine(s)
      description: >
        Where this runs. Core-hours get reported in the weekly update comments.
      placeholder: Archer2, Cirrus, OVH

  - type: textarea
    id: result
    attributes:
      label: Result
      description: >
        Leave empty until closing. On close, record the final outcome and the
        magnitude of its impact, then close the issue.
      placeholder: Filled in at close.
